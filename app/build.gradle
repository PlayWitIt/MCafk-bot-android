plugins {
    id "com.android.application"
}

android {
    namespace "app.afkbot"
    compileSdk 35

    defaultConfig {
        applicationId "app.afkbot"
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName "5.0.1"
    }

    signingConfigs {
        release {
            // Fixed key kept in the repo so every build can update the previous install.
            storeFile file("afkbot-release.p12")
            storePassword "afkbot123"
            keyAlias "afkbot"
            keyPassword "afkbot123"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // JavaScript engine for script mods (runs in interpreted mode on Android)
    implementation "org.mozilla:rhino:1.7.15"
}
