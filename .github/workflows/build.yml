name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AFKBot.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFKBot-apk
          path: AFKBot.apk

      - name: Publish to the "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AFKBot.apk \
            --title "AFK Bot (latest build)" \
            --notes "Download AFKBot.apk below and open it on your Android phone. Built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
